name: Build TWRP (Xiaomi 14T Pro - rothko)

# Kullanım: Bu dosyayı kendi GitHub deponda .github/workflows/ klasörüne koy,
# Actions sekmesinden "Run workflow" de. Çıktı (vendor_boot.img) Artifacts'ta olur.

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP minimal manifest branch"
        default: "twrp-14.1"
        required: true
      device_tree:
        description: "Device tree repo"
        default: "https://github.com/JonesqPacMan/android_device_xiaomi_rothko_twrp"
        required: true
      device_branch:
        description: "Device tree branch"
        default: "twrp-14.1_a16"
        required: true
      language:
        description: "Varsayilan dil (en, tr, id...)"
        default: "en"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Disk alanı aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Bağımlılıkları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python-is-python3 rsync bc cpio
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "builder"
          git config --global user.email "builder@localhost"

      - name: Kaynakları indir (minimal manifest)
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b ${{ inputs.manifest_branch }} --git-lfs
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Device tree'yi ekle
        run: |
          cd ~/twrp
          git clone --depth 1 -b ${{ inputs.device_branch }} ${{ inputs.device_tree }} device/xiaomi/rothko
          sed -i "s/^TW_DEFAULT_LANGUAGE := .*/TW_DEFAULT_LANGUAGE := ${{ inputs.language }}/" device/xiaomi/rothko/BoardConfig.mk
          grep TW_DEFAULT_LANGUAGE device/xiaomi/rothko/BoardConfig.mk

      - name: Swap ekle (Soong RAM'i yetmiyor)
        run: |
          free -h
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl vm.swappiness=60
          free -h
          df -h / /mnt

      - name: Derle (vendor_boot.img)
        run: |
          cd ~/twrp
          ( while true; do echo "[mem] $(free -m | awk '/Mem/{print $3"MB/"$2"MB"}') swap $(free -m | awk '/Swap/{print $3"MB"}')"; sleep 60; done ) &
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_rothko-ap2a-eng || lunch twrp_rothko-eng
          mka vendorbootimage -j$(nproc --all)

      - name: Çıktıyı yükle
        uses: actions/upload-artifact@v4
        with:
          name: twrp-rothko
          path: |
            ~/twrp/out/target/product/rothko/vendor_boot.img
            ~/twrp/out/target/product/rothko/*.img
          if-no-files-found: error
